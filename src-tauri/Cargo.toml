[package]
name = "keyai1-servo"
version = "1.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-runtime-verso-build = { git = "https://github.com/versotile-org/tauri-runtime-verso.git", rev = "dc1c1bfeadf65f3f4e38a4a3c6c960a70b749337" }

[dependencies]
tauri = { version = "2", default-features = false, features = ["common-controls-v6", "unstable"] }
tauri-runtime-verso = { git = "https://github.com/versotile-org/tauri-runtime-verso.git", rev = "dc1c1bfeadf65f3f4e38a4a3c6c960a70b749337" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"
wait-timeout = "0.2"
url = "2"
