name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --locked

      - name: Build NSIS installer
        shell: pwsh
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Package ZIP
        shell: pwsh
        working-directory: src-tauri
        run: |
          $installer = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          Compress-Archive -LiteralPath $installer.FullName -DestinationPath "target/release/bundle/KeyAI1-Windows-x64.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyAI1-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/KeyAI1-Windows-x64.zip
            src-tauri/target/release/keyai1-servo.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/KeyAI1-Windows-x64.zip
